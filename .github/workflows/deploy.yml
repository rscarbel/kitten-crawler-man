name: Deploy

# Publishes the game two places on every push to main: GitHub Pages, and the
# kitten-crawler-man/ folder of the ryanscarbel.com S3 bucket (fronted by
# CloudFront).
#
# Auth for the S3 half is GitHub OIDC — the runner assumes a role in the website
# account for the life of the job. This repo is public, so it holds no AWS key
# and no .env; the role's trust policy is what grants access, and it is scoped
# to this repo's main branch. The role lives in the personal-website repo as
# KittenCrawlerManDeployStack, deployed by hand:
#   AWS_PROFILE=personal-website npx cdk deploy KittenCrawlerManDeployStack
#
# Building here rather than from a laptop is also what keeps credentials out of
# the shipped bundle: scripts/build.js inlines .env values via esbuild `define`,
# and a runner has no .env, so AI_CLIENT_ID/AI_CLIENT_SECRET compile to "".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # required to request the OIDC token

# One deploy at a time, and never cancel one mid-flight: a halted `s3 sync`
# leaves the bucket holding half of two different builds.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One build feeds both targets, so the site and the offline ZIP can never
      # disagree about which bundle they contain.
      - name: Build site and offline ZIP
        run: npm run build:release

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment

      # A manual run on some other branch still publishes to Pages, but the role
      # trusts main only — skip rather than fail the job on a denied AssumeRole.
      - name: Assume the publish role (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # `no-cache` throughout, because no filename here is content-hashed: it
      # means "revalidate", not "don't store", so an unchanged asset still costs
      # only a 304. A real max-age would be actively harmful — the service
      # worker precaches with plain `cache.addAll`, which reads through the HTTP
      # cache, so a freshly installed worker would fill itself with stale bytes.
      - name: Publish to S3
        if: github.ref == 'refs/heads/main'
        env:
          TARGET: s3://${{ secrets.AWS_SITE_BUCKET }}/kitten-crawler-man
        run: |
          aws s3 sync _site/ "$TARGET/" \
            --delete \
            --exclude "kitten-crawler-man.zip" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3 cp dist/kitten-crawler-man.zip "$TARGET/kitten-crawler-man.zip" \
            --content-type application/zip \
            --cache-control "no-cache" \
            --only-show-errors

      - name: Invalidate CloudFront
        if: github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/kitten-crawler-man/*" \
            --query 'Invalidation.Id' \
            --output text
