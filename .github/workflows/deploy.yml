name: Deploy

# Publishes the game two places on every push to main: GitHub Pages, and the
# kitten-crawler-man/ folder of the ryanscarbel.com S3 bucket (fronted by
# CloudFront).
#
# Auth for the S3 half is GitHub OIDC — the runner assumes a role in the website
# account for the life of the job. This repo is public, so it holds no AWS key
# and no .env; the role's trust policy is what grants access, and it is scoped
# to this repo's main branch. The role lives in the personal-website repo as
# KittenCrawlerManDeployStack, deployed by hand:
#   AWS_PROFILE=personal-website npx cdk deploy KittenCrawlerManDeployStack
#
# Building here rather than from a laptop is also what keeps credentials out of
# the shipped bundle: scripts/build.js inlines .env values via esbuild `define`,
# and a runner has no .env, so AI_CLIENT_ID/AI_CLIENT_SECRET compile to "".

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one mid-flight: a halted `s3 sync`
# leaves the bucket holding half of two different builds.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # One build feeds both targets, so the site and the offline ZIP can never
  # disagree about which bundle they contain.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # actions/configure-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site and offline ZIP
        run: npm run build:release

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The same output again as an ordinary artifact, because the Pages
      # artifact can only be consumed by actions/deploy-pages.
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            _site
            dist/kitten-crawler-man.zip
          retention-days: 1

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  # Deliberately a separate job from `pages`, and deliberately without an
  # `environment:`. A job that targets an environment gets an OIDC token whose
  # subject is `repo:OWNER/REPO:environment:NAME` — the branch vanishes from it.
  # Keeping this job environment-free is what makes the subject
  # `repo:OWNER/REPO:ref:refs/heads/main`, which is what the role's trust policy
  # pins, so a run from any other branch cannot reach the bucket.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Assume the publish role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Browsers and CloudFront get different lifetimes from one header. No
      # filename here is content-hashed, so a browser must revalidate every load
      # (`max-age=0, must-revalidate`); that costs an edge round trip and a 304,
      # never a stale game. CloudFront reads `s-maxage` instead and holds each
      # file until the invalidation below replaces it, so S3 only sees traffic
      # once per deploy. `no-cache` is deliberately absent: the distribution's
      # cache policy would then hold each file for its one-second minimum TTL.
      - name: Publish to S3
        env:
          TARGET: s3://${{ secrets.AWS_SITE_BUCKET }}/kitten-crawler-man
          CACHE_CONTROL: public, max-age=0, must-revalidate, s-maxage=31536000
        run: |
          aws s3 sync _site/ "$TARGET/" \
            --delete \
            --exclude "kitten-crawler-man.zip" \
            --cache-control "$CACHE_CONTROL" \
            --only-show-errors
          aws s3 cp dist/kitten-crawler-man.zip "$TARGET/kitten-crawler-man.zip" \
            --content-type application/zip \
            --cache-control "$CACHE_CONTROL" \
            --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/kitten-crawler-man/*" \
            --query 'Invalidation.Id' \
            --output text
