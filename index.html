<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Kitten Crawler Man</title>
    <meta
      name="description"
      content="A browser-based dungeon crawler where a human and their cat fight through increasingly dangerous floors."
    />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" type="image/x-icon" href="src/images/website/goblin-icon.ico" />

    <link rel="apple-touch-icon" href="src/images/website/goblin-icon.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kitten Crawler Man" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Kitten Crawler Man" />

    <link rel="manifest" href="manifest.json" />

    <script src="dist/bundle.js" defer></script>
    <link rel="stylesheet" href="main.css" />
    <script>
      // Localhost is the dev server and the offline ZIP's launcher, both on port
      // 8080 and so one origin: a worker there would hand one of them the
      // other's files. Neither needs offline caching, so any worker left behind
      // is torn down, with one reload to leave its control.
      const LOCAL_HOSTNAMES = ['localhost', '127.0.0.1', '[::1]'];
      const isLocalhost = LOCAL_HOSTNAMES.includes(location.hostname);
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          if (!isLocalhost) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
            return;
          }
          const registrations = await navigator.serviceWorker.getRegistrations();
          if (registrations.length === 0) return;
          await Promise.all(registrations.map((registration) => registration.unregister()));
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((name) => caches.delete(name)));
          if (navigator.serviceWorker.controller !== null) location.reload();
        });
      }
    </script>
  </head>
  <body>
    <div id="game"></div>
  </body>
</html>
